<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Axiom Diagnostics</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/d3@7"></script>
<script src="https://cdn.jsdelivr.net/npm/d3-flame-graph@4.1.3/dist/d3-flamegraph.min.js"></script>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/d3-flame-graph@4.1.3/dist/d3-flamegraph.css">
<style>
  :root { --bg:#0e1116; --panel:#171c24; --line:#262d38; --txt:#dfe5ee; --muted:#8b96a5; --accent:#4fd1c5; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--txt); font:14px/1.5 system-ui,sans-serif; }
  header { padding:18px 24px; border-bottom:1px solid var(--line); display:flex; flex-wrap:wrap; gap:8px 24px; align-items:baseline; }
  header h1 { font-size:18px; margin:0; color:var(--accent); }
  header .meta { color:var(--muted); font-size:12px; display:flex; gap:18px; flex-wrap:wrap; }
  main { padding:20px 24px; display:grid; grid-template-columns:repeat(2,1fr); gap:18px; }
  .card { background:var(--panel); border:1px solid var(--line); border-radius:10px; padding:14px 16px; min-width:0; }
  .card.wide { grid-column:1 / -1; }
  .card h2 { font-size:13px; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin:0 0 12px; }
  canvas { max-height:280px; }
  table { width:100%; border-collapse:collapse; font-size:12px; }
  th,td { text-align:left; padding:4px 8px; border-bottom:1px solid var(--line); white-space:nowrap; }
  th { color:var(--muted); font-weight:600; }
  td.num { text-align:right; font-variant-numeric:tabular-nums; }
  .scroll { max-height:320px; overflow:auto; }
  .stat { display:flex; justify-content:space-between; padding:3px 0; border-bottom:1px solid var(--line); }
  .stat span:last-child { font-variant-numeric:tabular-nums; }
  #flame { background:#fff; border-radius:6px; padding:6px; }
  .err { padding:40px; text-align:center; color:#f87171; }
  .pill { background:#23303a; color:var(--accent); border-radius:999px; padding:1px 9px; font-size:11px; }
  tr.prow:hover { background:#1d242e; }
  .pd { padding:6px 2px 2px; }
  .pd-reasons { color:#f6ad55; margin-bottom:10px; font-size:12px; }
  .pd-reasons div { padding:1px 0; }
  .pd-grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(230px,1fr)); gap:16px; align-items:start; }
  .pd-grid > div { min-width:0; }
  .pd-grid table { margin-top:4px; }
  .pd-grid td { white-space:normal; word-break:break-all; border-bottom:1px solid #20262f; }
  #expiry { color:#8b96a5; font-size:12px; margin-left:auto; }
</style>
</head>
<body>
<header>
  <h1>Axiom Diagnostics</h1>
  <span class="pill" id="type">—</span>
  <div class="meta" id="meta"></div>
</header>
<main id="root"><div class="err">Loading report…</div></main>

<script>
const MB = 1024 * 1024;
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const fmtBytes = b => b == null ? "—" : (b / MB).toFixed(1) + " MB";
const fmtPct = v => v == null || v < 0 ? "—" : (v * 100).toFixed(1) + "%";
const dataUrl = location.pathname.replace(/\/$/, "") + "/data";

Chart.defaults.color = "#8b96a5";
Chart.defaults.borderColor = "#262d38";
Chart.defaults.font.family = "system-ui, sans-serif";

let expiresAt = 0;
fetch(dataUrl)
  .then(r => {
    if (!r.ok) throw new Error("HTTP " + r.status);
    expiresAt = parseInt(r.headers.get("X-Report-Expires-At") || "0", 10) || 0;
    return r.json();
  })
  .then(d => { render(d); startExpiryTicker(); })
  .catch(e => { document.getElementById("root").innerHTML =
    '<div class="err">Failed to load report: ' + e.message + '</div>'; });

function startExpiryTicker() {
  const el = document.getElementById("expiry");
  if (!el || !expiresAt) return;
  const tick = () => {
    const ms = expiresAt - Date.now();
    if (ms <= 0) { el.textContent = "expired"; el.style.color = "#f87171"; return; }
    const mins = Math.floor(ms / 60000), secs = Math.floor((ms % 60000) / 1000);
    el.textContent = "expires in " + mins + "m " + String(secs).padStart(2, "0") + "s";
    el.style.color = ms < 120000 ? "#f6ad55" : "#8b96a5";
    setTimeout(tick, 1000);
  };
  tick();
}

function card(title, inner, wide) {
  return '<section class="card' + (wide ? ' wide' : '') + '"><h2>' + title + '</h2>' + inner + '</section>';
}

function render(d) {
  document.getElementById("type").textContent = (d.type || "report").toUpperCase();
  const m = d.meta || {};
  const hd = d.heapDump;
  document.getElementById("meta").innerHTML = [
    ["Server", (m.serverBrand || "?") + " " + (m.minecraftVersion || "")],
    ["Version", m.serverVersion || "?"],
    ["Players", m.onlinePlayers ?? "?"],
    ["Worlds", m.loadedWorlds ?? "?"],
    ["CPUs", m.availableProcessors ?? "?"],
    ["Uptime", fmtDuration(m.uptimeMs)],
    m.durationMs ? ["Window", (m.durationMs / 1000) + "s"] : null,
    (d.plugins || []).length ? ["Plugins", d.plugins.length] : null,
    hd ? ["Heap dump", heapDumpSummary(hd)] : null,
    ["Generated", m.generatedAtEpochMs ? new Date(m.generatedAtEpochMs).toLocaleString() : "?"],
  ].filter(Boolean).map(x => "<span><b>" + esc(x[0]) + ":</b> " + esc(x[1]) + "</span>").join("")
    + '<span id="expiry"></span>';

  const root = document.getElementById("root");
  const cards = [];
  const hasTimeline = (d.tickTimeline || []).length > 1;

  if (hasTimeline) {
    cards.push(card("TPS / MSPT", '<canvas id="c-tick"></canvas>', true));
    cards.push(card("Heap & Non-Heap (timeline)", '<canvas id="c-mem"></canvas>'));
    cards.push(card("CPU load (timeline)", '<canvas id="c-cpu"></canvas>'));
  }
  cards.push(card("System", systemStats(d), false));
  cards.push(card("Memory pools", poolsTable(d), false));
  cards.push(card("Garbage collection", '<canvas id="c-gc"></canvas>'));
  cards.push(card("Thread states", '<canvas id="c-threads"></canvas>'));
  if ((d.lagSpikes || []).length) cards.push(card("Lag spikes (" + d.lagSpikes.length + ")", lagTable(d)));
  if ((d.leakSuspects || []).length) cards.push(card("Leak suspects (" + d.leakSuspects.length + ")", leakTable(d), true));
  if ((d.plugins || []).length) cards.push(card("Plugins (" + d.plugins.length + ")", pluginsTable(d), true));
  if ((d.packages || []).length) cards.push(card("Heap by package", packagesTable(d), true));
  cards.push(card("Heap histogram (top classes)", heapTable(d), true));
  if (d.flamegraph) cards.push(card("CPU profiler (flamegraph)", '<div id="flame"></div>', true));

  root.innerHTML = cards.join("");

  if (hasTimeline) { drawTick(d); drawMem(d); drawCpu(d); }
  drawGc(d);
  drawThreads(d);
  if (d.flamegraph) drawFlame(d.flamegraph);
  wirePluginDrilldown(d);
}

function fmtDuration(ms) {
  if (!ms) return "—";
  const s = Math.floor(ms / 1000), h = Math.floor(s / 3600), mn = Math.floor((s % 3600) / 60);
  return h + "h " + mn + "m";
}

function systemStats(d) {
  const s = d.system || {}, jit = d.jit || {};
  const rows = [
    ["Heap used", fmtBytes(s.heapUsed) + " / " + fmtBytes(s.heapMax)],
    ["Heap committed", fmtBytes(s.heapCommitted)],
    ["Non-heap used", fmtBytes(s.nonHeapUsed)],
    ["Process CPU", fmtPct(s.processCpuLoad)],
    ["System CPU", fmtPct(s.systemCpuLoad)],
    ["Load average", s.systemLoadAverage > 0 ? s.systemLoadAverage.toFixed(2) : "—"],
    ["Threads", s.threadCount + " (" + s.daemonThreadCount + " daemon, peak " + s.peakThreadCount + ")"],
    ["Loaded classes", s.loadedClasses],
    ["JIT compiler", jit.compilerName || "—"],
    ["JIT total time", jit.totalCompilationTimeMs != null ? jit.totalCompilationTimeMs + " ms" : "—"],
    jit.deltaCompilationTimeMs ? ["JIT time (window)", jit.deltaCompilationTimeMs + " ms"] : null,
  ].filter(Boolean);
  return rows.map(r => '<div class="stat"><span>' + esc(r[0]) + '</span><span>' + esc(r[1]) + '</span></div>').join("");
}

function poolsTable(d) {
  const pools = (d.system && d.system.pools) || [];
  return '<div class="scroll"><table><tr><th>Pool</th><th>Type</th><th class="num">Used</th><th class="num">Committed</th></tr>' +
    pools.map(p => '<tr><td>' + esc(p.name) + '</td><td>' + esc(p.type) + '</td><td class="num">' + fmtBytes(p.used) +
      '</td><td class="num">' + fmtBytes(p.committed) + '</td></tr>').join("") + '</table></div>';
}

function lagTable(d) {
  return '<div class="scroll"><table><tr><th class="num">t (s)</th><th class="num">MSPT</th></tr>' +
    d.lagSpikes.map(l => '<tr><td class="num">' + (l.t / 1000).toFixed(1) + '</td><td class="num">' +
      l.mspt.toFixed(1) + '</td></tr>').join("") + '</table></div>';
}

function heapTable(d) {
  const deltas = {};
  (d.heapDelta || []).forEach(x => deltas[x.name] = x);
  const hasDelta = (d.heapDelta || []).length > 0;
  return '<div class="scroll"><table><tr><th>Class</th><th class="num">Instances</th><th class="num">Bytes</th>' +
    (hasDelta ? '<th class="num">Δ bytes</th>' : '') + '</tr>' +
    (d.heap || []).map(h => {
      const dl = deltas[h.name];
      return '<tr><td>' + esc(h.name) + '</td><td class="num">' + h.instances.toLocaleString() +
        '</td><td class="num">' + fmtBytes(h.bytes) + '</td>' +
        (hasDelta ? '<td class="num" style="color:' + (dl && dl.bytesDelta > 0 ? "#f87171" : "#8b96a5") + '">' +
          (dl ? "+" + fmtBytes(dl.bytesDelta) : "—") + '</td>' : '') + '</tr>';
    }).join("") + '</table></div>';
}

function heapDumpSummary(hd) {
  if (!hd) return "—";
  if (!hd.captured) return "skipped (" + (hd.skipReason || "n/a") + ")";
  if (!hd.parsed) return "captured " + fmtBytes(hd.fileBytes) + ", parse failed";
  return fmtBytes(hd.fileBytes) + " · " + (hd.classCount || 0).toLocaleString() + " classes · " +
    (hd.classLoaderCount || 0) + " loaders (" + (hd.pluginClassLoaderCount || 0) + " plugin) · " +
    (hd.dumpMillis || 0) + "+" + (hd.parseMillis || 0) + "ms";
}

function sevColor(s) { return s === "high" ? "#f87171" : s === "medium" ? "#f6ad55" : "#8b96a5"; }
function scoreColor(v) { return v >= 60 ? "#f87171" : v >= 30 ? "#f6ad55" : "#68d391"; }
function ownerBadge(o) {
  const c = o === "minecraft" ? "#63b3ed" : o === "jdk" ? "#a0aec0" : o === "unknown" ? "#8b96a5" : "#4fd1c5";
  return '<span style="color:' + c + '">' + esc(o) + "</span>";
}

function leakTable(d) {
  const rows = d.leakSuspects.map(s =>
    '<tr><td><span style="color:' + sevColor(s.severity) + '">●</span> ' + esc(s.severity || "") + "</td>" +
    "<td>" + esc(s.kind || "") + "</td>" +
    "<td>" + (s.plugin ? esc(s.plugin) : '<span style="color:#8b96a5">—</span>') + "</td>" +
    "<td>" + esc(s.detail || "") + "</td>" +
    '<td class="num">' + (s.bytesDelta ? "+" + fmtBytes(s.bytesDelta) : (s.bytes ? fmtBytes(s.bytes) : "—")) + "</td>" +
    "<td>" + esc(s.reason || "") + "</td></tr>").join("");
  return '<div class="scroll"><table><tr><th>Severity</th><th>Kind</th><th>Plugin</th><th>Detail</th><th class="num">Size</th><th>Reason</th></tr>' + rows + "</table></div>";
}

function scoreBar(v) {
  return '<div style="display:flex;align-items:center;gap:6px"><div style="flex:0 0 56px;height:7px;background:#23303a;border-radius:4px;overflow:hidden">' +
    '<div style="width:' + Math.min(100, v) + "%;height:100%;background:" + scoreColor(v) + '"></div></div>' +
    '<span style="color:' + scoreColor(v) + '">' + v + "</span></div>";
}

function pluginsTable(d) {
  const rows = d.plugins.map((p, i) => {
    const head = '<tr class="prow" data-idx="' + i + '">' +
      "<td>▸ <b>" + esc(p.name) + '</b> <span style="color:#8b96a5">' + esc(p.version || "") + "</span></td>" +
      '<td class="num">' + (p.ownedClasses || 0).toLocaleString() + "</td>" +
      '<td class="num">' + fmtBytes(p.liveBytes) + "</td>" +
      '<td class="num" style="color:' + ((p.bytesDelta || 0) > 0 ? "#f87171" : "#8b96a5") + '">' +
        ((p.bytesDelta || 0) > 0 ? "+" + fmtBytes(p.bytesDelta) : "—") + "</td>" +
      '<td class="num">' + (p.threads || 0) + "</td>" +
      '<td class="num">' + (p.tasks || 0) + "</td>" +
      '<td class="num">' + (p.listeners || 0) + "</td>" +
      '<td class="num">' + (p.classLoaders || 1) + "</td>" +
      "<td>" + scoreBar(p.leakScore || 0) + "</td></tr>";
    const detail = '<tr class="pdetail" id="pd-' + i + '" style="display:none"><td colspan="9">' + pluginDetail(p) + "</td></tr>";
    return head + detail;
  }).join("");
  return '<div class="scroll"><table><tr><th>Plugin</th><th class="num">Classes</th><th class="num">Live</th><th class="num">Δ</th>' +
    '<th class="num">Thr</th><th class="num">Task</th><th class="num">Lstn</th><th class="num">CL</th><th>Leak</th></tr>' + rows + "</table></div>";
}

function pluginDetail(p) {
  let h = '<div class="pd">';
  if ((p.leakReasons || []).length) {
    h += '<div class="pd-reasons">' + p.leakReasons.map(r => "<div>⚠ " + esc(r) + "</div>").join("") + "</div>";
  }
  h += '<div class="pd-grid">';
  h += "<div><b>Main class</b><br><span style='color:#8b96a5'>" + esc(p.main || "?") + "</span><br><br>" +
    "<b>Loader</b> " + esc(p.loaderType || "?") + "<br><b>Authors</b> " + esc((p.authors || []).join(", ") || "—") +
    "<br><b>Enabled</b> " + (p.enabled ? "yes" : "no") + "</div>";
  if ((p.topClasses || []).length) {
    h += "<div><b>Top owned classes</b><table>" + p.topClasses.map(c =>
      "<tr><td>" + esc(c.name) + '</td><td class="num">' + (c.instances || 0).toLocaleString() +
      '</td><td class="num">' + fmtBytes(c.bytes) + "</td></tr>").join("") + "</table></div>";
  }
  if ((p.topPackages || []).length) {
    h += "<div><b>Top packages</b><table>" + p.topPackages.map(pk =>
      "<tr><td>" + esc(pk.name) + '</td><td class="num">' + fmtBytes(pk.bytes) + "</td></tr>").join("") + "</table></div>";
  }
  if ((p.threadNames || []).length) {
    h += "<div><b>Threads</b><br><span style='color:#8b96a5'>" + p.threadNames.map(t => esc(t)).join("<br>") + "</span></div>";
  }
  h += "</div></div>";
  return h;
}

function packagesTable(d) {
  const rows = d.packages.map(p =>
    "<tr><td>" + esc(p.name) + "</td><td>" + ownerBadge(p.owner || "unknown") + "</td>" +
    '<td class="num">' + (p.classes || 0).toLocaleString() + "</td>" +
    '<td class="num">' + (p.instances || 0).toLocaleString() + "</td>" +
    '<td class="num">' + fmtBytes(p.bytes) + "</td></tr>").join("");
  return '<div class="scroll"><table><tr><th>Package</th><th>Owner</th><th class="num">Classes</th><th class="num">Instances</th><th class="num">Bytes</th></tr>' + rows + "</table></div>";
}

function wirePluginDrilldown(d) {
  document.querySelectorAll(".prow").forEach(row => {
    row.style.cursor = "pointer";
    row.addEventListener("click", () => {
      const idx = row.getAttribute("data-idx");
      const det = document.getElementById("pd-" + idx);
      if (det) det.style.display = det.style.display === "none" ? "table-row" : "none";
    });
  });
}

function timeLabels(arr) { return arr.map(x => (x.t / 1000).toFixed(1)); }

function drawTick(d) {
  new Chart(document.getElementById("c-tick"), {
    type: "line",
    data: { labels: timeLabels(d.tickTimeline), datasets: [
      { label: "TPS", data: d.tickTimeline.map(x => x.tps), borderColor: "#4fd1c5", yAxisID: "y", tension: .25, pointRadius: 0 },
      { label: "MSPT", data: d.tickTimeline.map(x => x.mspt), borderColor: "#f6ad55", yAxisID: "y1", tension: .25, pointRadius: 0 },
    ]},
    options: { responsive: true, interaction: { mode: "index", intersect: false }, scales: {
      x: { title: { display: true, text: "seconds" } },
      y: { position: "left", min: 0, max: 20, title: { display: true, text: "TPS" } },
      y1: { position: "right", min: 0, grid: { drawOnChartArea: false }, title: { display: true, text: "MSPT" } },
    }}
  });
}

function drawMem(d) {
  const src = (d.memoryTimeline || []).length ? d.memoryTimeline : [];
  new Chart(document.getElementById("c-mem"), {
    type: "line",
    data: { labels: timeLabels(src), datasets: [
      { label: "Heap", data: src.map(x => x.heapUsed / MB), borderColor: "#63b3ed", fill: true, backgroundColor: "rgba(99,179,237,.15)", tension: .25, pointRadius: 0 },
      { label: "Non-heap", data: src.map(x => x.nonHeapUsed / MB), borderColor: "#b794f4", tension: .25, pointRadius: 0 },
    ]},
    options: { responsive: true, scales: { y: { title: { display: true, text: "MB" }, min: 0 } } }
  });
}

function drawCpu(d) {
  const src = (d.cpuTimeline || []);
  new Chart(document.getElementById("c-cpu"), {
    type: "line",
    data: { labels: timeLabels(src), datasets: [
      { label: "Process", data: src.map(x => x.process < 0 ? null : x.process * 100), borderColor: "#4fd1c5", tension: .25, pointRadius: 0 },
      { label: "System", data: src.map(x => x.system < 0 ? null : x.system * 100), borderColor: "#fc8181", tension: .25, pointRadius: 0 },
    ]},
    options: { responsive: true, scales: { y: { min: 0, max: 100, title: { display: true, text: "%" } } } }
  });
}

function drawGc(d) {
  const gc = d.gc || [];
  const useDelta = gc.some(c => c.deltaCount > 0);
  new Chart(document.getElementById("c-gc"), {
    type: "bar",
    data: { labels: gc.map(c => c.name), datasets: [
      { label: useDelta ? "Collections (window)" : "Collections", data: gc.map(c => useDelta ? c.deltaCount : c.collectionCount), backgroundColor: "#4fd1c5", yAxisID: "y" },
      { label: useDelta ? "Pause ms (window)" : "Pause ms (total)", data: gc.map(c => useDelta ? c.deltaTimeMs : c.collectionTimeMs), backgroundColor: "#f6ad55", yAxisID: "y1" },
    ]},
    options: { responsive: true, scales: {
      y: { position: "left", min: 0, title: { display: true, text: "count" } },
      y1: { position: "right", min: 0, grid: { drawOnChartArea: false }, title: { display: true, text: "ms" } },
    }}
  });
}

function drawThreads(d) {
  const states = (d.system && d.system.threadStates) || {};
  new Chart(document.getElementById("c-threads"), {
    type: "doughnut",
    data: { labels: Object.keys(states), datasets: [{ data: Object.values(states),
      backgroundColor: ["#4fd1c5", "#f6ad55", "#fc8181", "#63b3ed", "#b794f4", "#68d391", "#a0aec0"] }] },
    options: { responsive: true, plugins: { legend: { position: "right" } } }
  });
}

function drawFlame(root) {
  const chart = flamegraph().width(document.getElementById("flame").clientWidth).cellHeight(18).minFrameSize(2);
  d3.select("#flame").datum(root).call(chart);
  window.addEventListener("resize", () => chart.width(document.getElementById("flame").clientWidth).resetZoom());
}
</script>
</body>
</html>
